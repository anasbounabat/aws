# CI/CD : vérification sur chaque push, déploiement AWS sur branches staging / production.
# Variables GitLab à configurer : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, (+ optionnel) fichiers .env injectés.

stages:
  - verify
  - deploy

variables:
  NODE_ENV: production

default:
  image: oven/bun:1.2.7
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - code/**/node_modules/
      - .bun/

# --- CI : lint, tests, build Turbo (tous les commits sauf tags) ---
verify:
  stage: verify
  script:
    - bun --version
    - bun install
    - bun run lint
    - bun run test
    - bun run build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# --- CD : déploiement (nécessite verify OK + credentials AWS + .env dans le repo CI ou variables) ---
.deploy_aws_base: &deploy_aws_base
  stage: deploy
  image: oven/bun:1.2.7
  needs:
    - verify
  before_script:
    - apt-get update && apt-get install -y zip python3-pip
    - pip3 install --no-cache-dir awscli

deploy:staging:
  <<: *deploy_aws_base
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  script:
    - export STAGE=stg
    - bun install
    - bun infrastructure/scripts/migrate.ts
    - bash infrastructure/scripts/deploy-api.sh
    - bash infrastructure/scripts/deploy-crons.sh
    - bash infrastructure/scripts/deploy-assets.sh
    - bash infrastructure/scripts/deploy-front-user.sh
    - bash infrastructure/scripts/deploy-front-admin.sh

deploy:production:
  <<: *deploy_aws_base
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
  script:
    - export STAGE=prd
    - bun install
    - bun infrastructure/scripts/migrate.ts
    - bash infrastructure/scripts/deploy-api.sh
    - bash infrastructure/scripts/deploy-crons.sh
    - bash infrastructure/scripts/deploy-assets.sh
    - bash infrastructure/scripts/deploy-front-user.sh
    - bash infrastructure/scripts/deploy-front-admin.sh
